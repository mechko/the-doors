services:
  the-doors-frontend:
    image: ghcr.io/mechko/the-doors-frontend:latest
    ports:
      - "${HTTP_PORT:-3000}:80"
      - "${HTTPS_PORT:-3443}:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - the-doors-backend
    networks:
      - the-doors-network

  the-doors-backend:
    image: ghcr.io/mechko/the-doors-backend:latest
    expose:
      - "8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql://mrbs_user:mrbs_password@mysql:3306/mrbs}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to a random 32+ character value}
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - RUST_LOG=${RUST_LOG:-info}
      - DATABASE_CONNECT_RETRIES=${DATABASE_CONNECT_RETRIES:-60}
      - DATABASE_CONNECT_RETRY_DELAY_SECONDS=${DATABASE_CONNECT_RETRY_DELAY_SECONDS:-2}
      - DATABASE_CONNECT_TIMEOUT_SECONDS=${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      - CCU_JACK_URL=${CCU_JACK_URL:-https://your-ccu-jack-host}
      - CCU_JACK_ACCEPT_INVALID_CERTS=${CCU_JACK_ACCEPT_INVALID_CERTS:-false}
      - TIME_WINDOW_BEFORE_BOOKING=${TIME_WINDOW_BEFORE_BOOKING:-600}
      - TIME_WINDOW_AFTER_BOOKING=${TIME_WINDOW_AFTER_BOOKING:-600}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - the-doors-network

  mysql:
    image: mysql:8.0
    command:
        - '--skip-log-bin'
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=mrbs
      - MYSQL_USER=mrbs_user
      - MYSQL_PASSWORD=mrbs_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./tmp:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent && mysql --protocol=tcp -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null"]
      timeout: 20s
      retries: 10
    networks:
      - the-doors-network

volumes:
  caddy_data:
  caddy_config:
  mysql_data:

networks:
  the-doors-network:
    driver: bridge
